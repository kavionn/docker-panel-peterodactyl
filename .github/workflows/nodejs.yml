name: Node.js 18-26 with shared tools

on:
  push:
    branches: [ main, master ]
    paths:
      - 'nodejs/**'
      - '.github/workflows/nodejs.yml'
  workflow_dispatch:

concurrency:
  group: nodejs-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 19, 20, 21, 22, 23, 24, 25, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        run: |
          if [ ! -f "nodejs/${{ matrix.node-version }}/Dockerfile" ]; then
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nodejs/${{ matrix.node-version }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/panel:node_${{ matrix.node-version }}
            ghcr.io/${{ github.repository_owner }}/panel:node_${{ matrix.node-version }}-ytdlp-2026.08.19
            ghcr.io/${{ github.repository_owner }}/panel:node_${{ matrix.node-version }}-ytdlp-2026.08.19-r2
            ghcr.io/${{ github.repository_owner }}/panel:node_${{ matrix.node-version }}-ytdlp-2026.08.19-r3
            ghcr.io/${{ github.repository_owner }}/panel:node_${{ matrix.node-version }}-ytdlp-2026.08.19-r4
          cache-from: type=gha,scope=nodejs${{ matrix.node-version }}
          cache-to: type=gha,mode=max,scope=nodejs${{ matrix.node-version }}
          provenance: false
          sbom: false

      - name: Verify shared tools and startup helper
        run: |
          image="ghcr.io/${{ github.repository_owner }}/panel:node_${{ matrix.node-version }}-ytdlp-2026.08.19-r4"
          docker pull --platform linux/amd64 "$image"
          node_major="$(docker run --rm --platform linux/amd64 "$image" node --version | sed -E 's/^v([0-9]+).*/\1/')"
          test "$node_major" = "${{ matrix.node-version }}"
          version="$(docker run --rm --platform linux/amd64 "$image" yt-dlp --ignore-config --version)"
          test "$version" = "2026.08.19"
          docker run --rm --platform linux/amd64 "$image" sh -c \
            'command -v python3 && command -v pip3 && command -v ffmpeg && command -v cloudflared'
          docker run --rm --platform linux/amd64 "$image" bash -n /usr/local/bin/ptero-startup
          docker run --rm --platform linux/amd64 \
            -e CLOUDFLARE_TUNNEL_ENABLED=0 \
            -e STARTUP_COMMAND='printf startup-helper-ok' \
            "$image" /usr/local/bin/ptero-startup | grep -q 'startup-helper-ok'
          mkdir -p legacy-home/.ptero
          touch legacy-home/.ptero/startup.sh
          chmod -R a+rwx legacy-home
          docker run --rm --platform linux/amd64 \
            -v "$PWD/legacy-home:/home/container" \
            -e CLOUDFLARE_TUNNEL_ENABLED=0 \
            -e STARTUP_COMMAND=true \
            "$image" /usr/local/bin/ptero-startup
          test ! -e legacy-home/.ptero/startup.sh
          test -s legacy-home/run.js
          mkdir -p existing-runner-home
          printf '%s\n' 'console.log("custom runner");' > existing-runner-home/run.js
          chmod -R a+rwx existing-runner-home
          docker run --rm --platform linux/amd64 \
            -v "$PWD/existing-runner-home:/home/container" \
            -e CLOUDFLARE_TUNNEL_ENABLED=0 \
            -e STARTUP_COMMAND=true \
            "$image" /usr/local/bin/ptero-startup
          grep -qx 'console.log("custom runner");' existing-runner-home/run.js
